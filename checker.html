<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>Prerequisite Checker</title>

<link rel="stylesheet" href="css/style.css">

<style>

.checker {
    max-width: 800px;
    margin: 70px auto;
    background: white;
    padding: 45px;
    border-radius: 15px;
    box-shadow: 0 5px 30px rgba(0,0,0,.1);
}

.checker h1 {
    text-align: center;
    margin-bottom: 15px;
}

.checker p {
    text-align: center;
    color: #64748b;
    margin-bottom: 35px;
}

label {
    font-weight: bold;
}

select {
    width: 100%;
    padding: 15px;
    margin-top: 10px;
    margin-bottom: 25px;
    border: 1px solid #ccc;
    border-radius: 8px;
}

.course-list {
    background: #f8fafc;
    padding: 20px;
    border-radius: 10px;
    margin-bottom: 25px;
}

.course-list label {
    display: block;
    margin: 12px 0;
}

.check-btn {
    width: 100%;
    padding: 15px;
    background: #2563eb;
    border: none;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
}

.result {
    margin-top: 25px;
    padding: 20px;
    border-radius: 10px;
    display: none;
}

.success {
    background: #dcfce7;
    color: #166534;
}

.failure {
    background: #fee2e2;
    color: #991b1b;
}

</style>

</head>

<body>

<header>

<div class="logo">CoursePath</div>

<nav>
<a href="index.html">Home</a>
<a href="courses.html">Courses</a>
<a href="prerequisites.html">Prerequisites</a>
<a href="checker.html">Checker</a>
<a href="graph.html">Graph</a>
<a href="pathfinder.html">Path Finder</a>
<a href="about.html">About</a>
</nav>

</header>

<div class="checker">

<h1>Prerequisite Checker</h1>

<p>
Select the course and the subjects you have already completed.
</p>

<label>Select Target Course</label>

<select id="courseSelect">

<option value="">
-- Select Course --
</option>

</select>

<h3>Completed Courses</h3>

<div class="course-list" id="completedCourses"></div>

<button class="check-btn" onclick="checkEligibility()">
Check Eligibility
</button>

<div id="result" class="result"></div>

</div>

<script src="js/courses.js"></script>

<script src="js/checker.js"></script>

</body>

</html>
